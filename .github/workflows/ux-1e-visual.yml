name: UX-1E Visual Acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-1e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux-1e-visual-acceptance:
    name: UX-1E Wall / Inbox visual acceptance (Ubuntu / pinned Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Apply pinned dependency patch
        run: npx --no-install patch-package
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Build exact presentation assets
        run: npm run build
      - name: Capture and qualify UX-1E Wall and Inbox states
        env:
          UX_1E_VISUAL_OUTPUT: artifacts/ux-1e-visual
        run: node scripts/capture-ux-1e-visual.js
      - name: Preserve UX-1E rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ux-1e-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ux-1e-visual
          if-no-files-found: warn
          retention-days: 90
