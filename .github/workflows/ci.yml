name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24.19.0 / npm 11.17.0 verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify exact runtime provenance
        run: npm run release:check:runtime

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Apply pinned dependency patch
        run: npx --no-install patch-package

      - name: Run deterministic quality gate
        run: npm run check

  live-read-smoke:
    name: Live Hive read-only smoke
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Apply pinned dependency patch
        run: npx --no-install patch-package

      - name: Verify production targets through read-only RPC calls
        env:
          NODE_ENV: development
          SITE_NAME: 4th Street Bar
          HIVE_COMMUNITY_ID: hive-108590
          THREADS_CONTAINER_ACCOUNT: fourthst.threads
          HIVE_RPC_NODES: https://api.hive.blog,https://api.deathwing.me,https://api.openhive.network
          HIVE_WRITE_MODE: disabled
          LOG_LEVEL: info
        run: npm run smoke:live
