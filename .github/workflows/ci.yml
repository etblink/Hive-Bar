name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24.19.0 / npm 11.17.0 verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Apply pinned dependency patch
        run: npx --no-install patch-package
      - name: Run deterministic quality gate
        run: npm run check

  visual-acceptance:
    name: M18.2 visual acceptance (Ubuntu / pinned Chromium)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Apply pinned dependency patch
        run: npx --no-install patch-package
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Qualify M19.3.1 onboarding browser modules
        run: npm run test:browser:m19-3-1
      - name: Build exact presentation assets
        run: npm run build
      - name: Capture and qualify M18.2 viewports
        env:
          M18_VISUAL_OUTPUT: artifacts/m18-visual
        run: npm run test:visual:m18
      - name: Preserve M18.2 rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m18-2-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m18-visual
          if-no-files-found: warn
          retention-days: 90

  m18-3-visual-acceptance:
    name: M18.3 Home / Wall / Pay visual acceptance (Ubuntu / pinned Chromium)
    needs:
      - verify
      - visual-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Apply pinned dependency patch
        run: npx --no-install patch-package
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Build exact presentation assets
        run: npm run build
      - name: Capture and qualify M18.3 viewports
        env:
          M18_3_VISUAL_OUTPUT: artifacts/m18-3-visual
        run: npm run test:visual:m18-3
      - name: Preserve M18.3 rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m18-3-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m18-3-visual
          if-no-files-found: warn
          retention-days: 90

  m18-4-visual-acceptance:
    name: M18.4 beta-readiness patron visual acceptance (Ubuntu / pinned Chromium)
    needs:
      - verify
      - visual-acceptance
      - m18-3-visual-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Apply pinned dependency patch
        run: npx --no-install patch-package
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Build exact presentation assets
        run: npm run build
      - name: Capture and qualify M18.4 patron surfaces
        env:
          M18_4_VISUAL_OUTPUT: artifacts/m18-4-visual
        run: npm run test:visual:m18-4
      - name: Preserve M18.4 rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m18-4-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/m18-4-visual
          if-no-files-found: warn
          retention-days: 90

  ux-1a-visual-acceptance:
    name: UX-1A Threads visual acceptance (Ubuntu / pinned Chromium)
    needs:
      - verify
      - m18-4-visual-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify exact runtime provenance
        run: npm run release:check:runtime
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Apply pinned dependency patch
        run: npx --no-install patch-package
      - name: Install pinned Chromium runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Build exact presentation assets
        run: npm run build
      - name: Capture and qualify UX-1A Threads states
        env:
          UX_1A_VISUAL_OUTPUT: artifacts/ux-1a-visual
        run: npm run test:visual:ux-1a
      - name: Preserve UX-1A rendered evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ux-1a-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ux-1a-visual
          if-no-files-found: warn
          retention-days: 90

  live-read-smoke:
    name: Live Hive read-only smoke
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Apply pinned dependency patch
        run: npx --no-install patch-package
      - name: Verify production targets through read-only RPC calls
        env:
          NODE_ENV: development
          SITE_NAME: 4th Street Bar
          HIVE_COMMUNITY_ID: hive-108590
          THREADS_CONTAINER_ACCOUNT: fourthst.threads
          HIVE_RPC_NODES: https://api.hive.blog,https://api.deathwing.me,https://api.openhive.network
          HIVE_WRITE_MODE: disabled
          LOG_LEVEL: info
        run: npm run smoke:live
